%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/csot,vtdr6130.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: CSOT VTDR6130 AMOLED DSI Panel

maintainers:
  - Jens Reidel <adrian@travitia.xyz>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: csot,vtdr6130

  reg:
    maxItems: 1
    description: DSI virtual channel

  reset-gpios: true
  vdd-supply: true
  vddio-supply: true
  dvdd-supply: true
  port: true

required:
  - compatible
  - reg
  - reset-gpios
  - vdd-supply
  - vddio-supply
  - dvdd-supply
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "csot,vtdr6130";
            reg = <0>;

            reset-gpios = <&tlmm 44 GPIO_ACTIVE_LOW>;

            vdd-supply = <&vreg_l13c_3p0>;
            vddio-supply = <&vreg_l12c_1p8>;
            dvdd-supply = <&vreg_oled_dvdd>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };
...
