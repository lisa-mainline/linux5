%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5k3t2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5K3T2 image sensor

description:
  The Samsung S5K3T2 is a 20-megapixel CMOS image sensor. It outputs RAW10
  image data over a four-lane MIPI CSI-2 D-PHY interface.

maintainers:
  - Oleksii Onchul <oleksiionchul@gmail.com>

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5k3t2

  reg:
    maxItems: 1

  clocks:
    description: Sensor input clock
    maxItems: 1

  reset-gpios:
    description: Active-low reset GPIO
    maxItems: 1

  vdda-supply:
    description: Analogue power supply, 2.8 volts

  vddd-supply:
    description: Digital core power supply, 1.05 volts

  vddio-supply:
    description: Digital I/O power supply, 1.8 volts

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

        required:
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - vdda-supply
  - vddd-supply
  - vddio-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "samsung,s5k3t2";
            reg = <0x10>;
            clocks = <&camera_clk>;
            reset-gpios = <&gpio 20 GPIO_ACTIVE_LOW>;
            vdda-supply = <&camera_vana>;
            vddd-supply = <&camera_vdig>;
            vddio-supply = <&camera_vio>;

            port {
                endpoint {
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <240000000 716800000>;
                    remote-endpoint = <&csi_receiver_ep>;
                };
            };
        };
    };
...
